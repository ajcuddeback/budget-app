name: budget_owl
description: "Budget Owl for iOS and Android: your household's budget, talking to your own server."
# Never published to pub.dev. The app ships knowing no server (ADR-0016, ADR-0042).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

# Every package is pinned by pubspec.lock, which is committed (mobile-app.md, attack 12).
# Nothing that phones home: no analytics, no crash reporting, no ads. A package that does is a
# privacy defect, not a dependency choice (ADR-0016) — test/architecture/dependencies_test.dart
# fails the build on the usual suspects.
dependencies:
  decimal: ^3.2.7
  dio: ^5.11.1
  drift: ^2.35.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.4
  intl: ^0.20.3
  material_ui: ^1.1.0
  meta: ^1.19.0
  path_provider: ^2.1.6
  # SQLite itself, bundled through build hooks. The user define below selects the SQLCipher
  # build, which is what encrypts the cache (ADR-0042). sqlcipher_flutter_libs is end-of-life and
  # replaced by exactly this option.
  sqlite3: ^3.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true
  generate: true
  # Bundled from design/fonts by tools/mobile-tokens.sh, never fetched (non-negotiable 9). Each
  # web subset is its own family; lib/core/theme/app_theme.dart lists the -ext one as a fallback.
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Latin.ttf
    - family: Figtree Ext
      fonts:
        - asset: assets/fonts/Figtree-LatinExt.ttf
    - family: Caprasimo
      fonts:
        - asset: assets/fonts/Caprasimo-Latin.ttf
    - family: Caprasimo Ext
      fonts:
        - asset: assets/fonts/Caprasimo-LatinExt.ttf
