# Configuration comes from the environment. No secrets in this file, ever (non-negotiable #1).
# First run must work with nothing set beyond a database password.
spring:
  application:
    name: budget-owl
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:budgetowl}
    username: ${DB_USER:budgetowl}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # NEVER `update`. Schema changes are Flyway migrations (ADR-0007, non-negotiable #4).
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # Migrations run unattended on a machine nobody is watching.
    locations: classpath:db/migration
    validate-on-migrate: true
  threads:
    virtual:
      enabled: true
  jackson:
    deserialization:
      # A typo'd field is an error, not a silently ignored value (docs/guides/api-style.md), and
      # it is also what stops a request body carrying a property nobody meant to accept.
      fail-on-unknown-properties: true
  session:
    # Idle timeout, server-enforced (docs/architecture/security-model.md). The absolute cap is
    # budgetowl.security.session.absolute-timeout below — Spring Session has no notion of one.
    timeout: 30m
    jdbc:
      # Flyway owns the schema (ADR-0007). V7 creates Spring Session's tables verbatim.
      initialize-schema: never

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: BUDGETOWL_SESSION
        http-only: true
        # Never readable from JS, never sent over plain HTTP. A self-hoster terminating TLS at a
        # reverse proxy keeps the default; one on a LAN with no certificate at all has to opt out
        # explicitly, because doing it silently is how a session cookie ends up on the wire.
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
        path: /
  error:
    # Stack traces are for logs, not for HTTP clients.
    include-stacktrace: never
    include-message: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # Health only. Anything more is an information-disclosure decision, not a default.
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# Everything below is ours. No secrets here: these are shapes and durations, not credentials.
budgetowl:
  security:
    # BCrypt via DelegatingPasswordEncoder, strength >= 12 (security-model.md). Configurable only
    # so the test suite can run a cheap factor; a deployment has no reason to lower it.
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
    session:
      # Absolute cap, server-enforced, independent of activity.
      absolute-timeout: 12h
    token:
      # Mobile bearer tokens: sliding expiry with an absolute cap (ADR-0018).
      idle-timeout: 30d
      absolute-timeout: 180d
    rate-limit:
      # Per IP and per email, exponential backoff, never a permanent lock — a permanent lock is a
      # denial of service against the real user.
      permitted-failures: 5
      initial-delay: 2s
      maximum-delay: 15m
  invitations:
    # Default 7 days. The link is a credential, so its lifetime is a security setting.
    time-to-live: 7d

logging:
  level:
    root: INFO
    com.budgetowl: INFO
    # Two framework loggers are pinned above DEBUG because they echo user data by design, and an
    # operator turning DEBUG on when something is wrong is the worst possible moment for a log to
    # start collecting it (ADR-0028, docs/architecture/security-model.md). Both were found by
    # AccountDisclosureIT, which asserts they stay quiet with the root logger at DEBUG.
    #
    #   org.hibernate.orm.core prints every column of every flushed entity through Hibernate's
    #   own EntityPrinter — every mapped column of every entity in the persistence context at
    #   flush: an account's name, last_four and opening_balance, a user's email and display name,
    #   and PasswordCredential.passwordHash on the POST /api/auth/password path, which prints the
    #   replaced bcrypt hash twice. This pin is the ONLY thing protecting that hash — the entity
    #   split protects it from being read, not from being printed. It does
    #   not use the entity's toString, so redacting that (as Account does) does nothing here.
    #
    #   ExceptionHandlerExceptionResolver logs the resolved exception, and a Bean Validation
    #   failure carries the value it rejected: "rejected value [98765]" for a mistyped
    #   last_four. Our own problem responses never echo a rejected value; this line is not ours.
    #
    # Raising org.hibernate.orm.core alone does NOT restore its output: the flush listener gates
    # on a different logger, so an operator who tries it gets silence and reaches for root=TRACE,
    # which is the worst available option. Nothing below TRACE is pinned,
    # so a root logger set to TRACE still binds JDBC parameters into the log — that is a
    # deliberate act rather than a default, and it is recorded in docs/memory/gotchas.md.
    org.hibernate.orm.core: INFO
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: INFO
    # The same logger prints the same MethodArgumentNotValidException, rejected value and all, so
    # pinning only the resolver above was half a control.
    org.springframework.web.method.HandlerMethod: INFO
    #
    # Tomcat's request plumbing writes CREDENTIALS, not merely user data, which security-model.md
    # says must never reach a log — a stronger rule than "DEBUG is safe", so TRACE is not an
    # acceptable escape hatch for these three. Measured, with root at TRACE:
    #
    #   Http11InputBuffer        the entire raw request — request line, every header, and the body.
    #                            A login body is a plaintext password.
    #   Rfc6265CookieProcessor   BUDGETOWL_SESSION and XSRF-TOKEN, parsed and echoed.
    #   CoyoteAdapter            the requested session id.
    #
    # Tomcat gates these on its own FINER level, which jul-to-slf4j maps to slf4j DEBUG — so the
    # line is produced only at root=TRACE but is STAMPED DEBUG on the way out. An operator who
    # filters an appender to "DEBUG and above" cannot separate it from ordinary debug output, and
    # a log shipper keying on level will not drop it. That mismatch is the reason these are pinned
    # rather than left to the operator's judgement.
    org.apache.coyote.http11.Http11InputBuffer: INFO
    org.apache.tomcat.util.http.Rfc6265CookieProcessor: INFO
    org.apache.catalina.connector.CoyoteAdapter: INFO
