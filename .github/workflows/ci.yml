name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          # No `cache: maven` here: it fails the job outright when no pom.xml exists, which
          # is the state until the backend lands. Cached explicitly below instead.

      - name: Cache Maven packages
        if: hashFiles('backend/pom.xml') != ''
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run the gate
        run: tools/verify.sh

  ui:
    name: UI validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install UI harness
        working-directory: tools/ui
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Prove the UI harness works
        run: tools/ui-check.sh --selfcheck
      - name: Prove the user-guide capture pipeline works
        run: tools/userguide-capture.sh --selfcheck
      - name: Check the user guide for rot
        run: tools/userguide-check.sh
      - name: Prove captures refuse a non-local target
        run: |
          if tools/userguide-capture.sh --url https://budget.example.com >/dev/null 2>&1; then
            echo "Capture guard did NOT refuse a remote target — see ADR-0013" >&2
            exit 1
          fi
          echo "Capture guard correctly refused a remote target." 
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-artifacts
          path: tools/ui/artifacts/
          retention-days: 7

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # java-kotlin is added when backend/ exists — CodeQL's autobuild fails outright on a
        # repository with no Java source, and a permanently red check trains people to ignore CI.
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
