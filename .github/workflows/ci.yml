name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run the whole gate on demand, on any branch. Useful for checking a change to CI itself, or a
  # job that only fires on a schedule, without opening a pull request to find out.
  workflow_dispatch:
  schedule:
    # Weekly full mutation run. Scoped-to-changed-classes runs on every PR; this catches decay
    # in code nobody has touched (ADR-0024).
    - cron: '0 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. Job-level blocks REPLACE this one rather than merging with it,
# so every job that needs anything states its full set explicitly.
permissions:
  contents: read

# Every action is pinned to a full commit SHA, GitHub's own included: a tag such as `@v5` can be
# moved to any commit, which would run code nobody reviewed with this workflow's token. The
# comment names the release the SHA was resolved from (`git ls-remote --tags`, 2026-11-28).
# .github/dependabot.yml proposes the updates. No job pushes, so every checkout sets
# `persist-credentials: false` and the token is not left in .git/config for later steps.

env:
  JAVA_VERSION: '21'
  # Angular 22 requires >= 22.22.3. Pinning the minor avoids a runner picking up 22.22.2 and
  # failing with a message about Node rather than about the code.
  NODE_VERSION: '24'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Require Docker for integration tests
        # Testcontainers runs the real PostgreSQL the integration tests and Flyway migrations
        # need (ADR-0009). Asserted explicitly so a runner without Docker fails HERE, with a
        # message that says why, rather than silently skipping the tests that matter most.
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo "::error::Docker is unavailable on this runner. Integration tests use" \
                 "Testcontainers against real PostgreSQL (ADR-0009) and cannot be skipped." >&2
            exit 1
          fi

      - name: Format
        run: mvn -B -f backend spotless:check

      - name: Compile, unit + architecture + integration tests
        run: mvn -B -f backend verify

      - name: Coverage threshold
        run: mvn -B -f backend jacoco:check

      - name: Static analysis (SpotBugs)
        run: mvn -B -f backend com.github.spotbugs:spotbugs-maven-plugin:4.10.4.1:check

      - name: Static analysis (PMD)
        run: mvn -B -f backend org.apache.maven.plugins:maven-pmd-plugin:check

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/site/jacoco/
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm --prefix frontend ci --no-audit --no-fund
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run test:coverage
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend audit --audit-level=high

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7
          if-no-files-found: ignore

  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compose file is valid, and refuses to start without a password
        run: |
          DB_PASSWORD=ci-only docker compose config --quiet
          if DB_PASSWORD= docker compose config --quiet >/dev/null 2>&1; then
            echo "::error::compose accepted an empty DB_PASSWORD" >&2
            exit 1
          fi

      - name: Build images
        run: |
          docker build -t budget-owl-api:ci ./backend
          docker build -t budget-owl-web:ci ./frontend

      - name: Backup, destroy the volume, restore
        # tools/deploy-check.sh builds the Compose images itself (the layers above are cached) and
        # runs as its own project with throwaway credentials. `age` makes it check the encrypted
        # round trip too, rather than skipping it.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age >/dev/null
          tools/deploy-check.sh --remove-images

      - name: Scan images for known vulnerabilities
        # Pinned to a commit, not a moving tag: a tag can be repointed at any commit, which means
        # arbitrary third-party code running in CI. Resolved from refs/tags/0.33.1^{}.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: budget-owl-api:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Scan the web image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: budget-owl-web:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Cache the NVD database
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-

      - name: OWASP dependency-check
        # Without an NVD API key the feed is rate-limited into uselessness and the scan reports
        # nothing because it never finished — silence that looks like a pass. Fail loudly instead
        # and tell the maintainer what to add.
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::NVD_API_KEY repository secret is not set. Without it this scan" \
                 "cannot complete, and a scan that does not finish is not a passing scan." \
                 "Get a free key at https://nvd.nist.gov/developers/request-an-api-key" >&2
            exit 1
          fi
          mvn -B -f backend dependency-check:check

  ui:
    name: UI validation
    # Pinned, unlike every other job here, because this one runs a browser that is itself pinned.
    # `ubuntu-latest` moved to Ubuntu 26.04 on 2026-10-19 (GitHub warned in an annotation months
    # before), and Playwright 1.56.1 refuses to install Chromium there:
    #
    #   Cannot install dependencies for ubuntu26.04-x64 with Playwright 1.56.1!
    #   ERROR: Playwright does not support chromium on ubuntu26.04-x64
    #
    # tools/ui/package.json pins Playwright to an exact version on purpose — the user guide's
    # screenshots are committed artefacts, so the renderer moving underneath us would rewrite
    # them. A pinned browser needs a pinned OS; letting one of the pair drift is what broke this.
    # Lift the pin and this comment together when Playwright is upgraded past 26.04 support.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install UI harness
        working-directory: tools/ui
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Install the app
        run: npm --prefix frontend ci --no-audit --no-fund

      - name: Prove the harness works with no app present
        run: tools/ui-check.sh --selfcheck

      - name: Drive the real UI, screenshot it, check accessibility
        run: tools/ui-check.sh --serve

      - name: Prove the user-guide capture pipeline works
        run: tools/userguide-capture.sh --selfcheck

      - name: Check the user guide for rot
        run: tools/userguide-check.sh

      - name: Prove captures refuse a non-local target
        run: |
          if tools/userguide-capture.sh --url https://budget.example.com >/dev/null 2>&1; then
            echo "Capture guard did NOT refuse a remote target — see ADR-0013" >&2
            exit 1
          fi

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-artifacts
          path: tools/ui/artifacts/
          retention-days: 7

  mobile:
    name: Mobile
    # Pinned for the same reason as UI validation: the toolchain includes the image. The Android
    # debug build needs the Android SDK that this image ships at $ANDROID_HOME, and verify.sh
    # treats a missing SDK as a failure in CI, not a skip.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # The release mobile/ is developed and verified on. Pinned three ways: the version names it,
      # the archive's SHA-256 proves the bytes (from the release index at
      # storage.googleapis.com/flutter_infra_release/releases/releases_linux.json), and the
      # framework revision is checked after install. Bump all three together.
      FLUTTER_VERSION: '3.50.1'
      FLUTTER_SHA256: '4ad17fc8462fbcef2ba19ff4a78c0a16b7147fde1add8578e267ea62cdb92678'
      FLUTTER_REVISION: 'ae9b586f34a8443573f82ef57c3bf914a908cbf7'
      # The flutter and dart tools report usage to Google by default. A CI run must not phone home
      # on anyone's behalf (ADR-0016). Job-wide, so it covers the install check as well as verify.sh.
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Android Gradle build runs on a JDK; the same one the backend uses.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Install Flutter
        # Flutter's own release archive, checked against a pinned hash, rather than a third-party
        # setup action: one less party's code running in CI.
        run: |
          archive="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/$archive"
          echo "$FLUTTER_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          # --no-same-owner: run as root, tar would keep the archive's owner, and git (which
          # flutter runs on its own checkout) then refuses the tree as "dubious ownership".
          tar --no-same-owner -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          rm "$RUNNER_TEMP/$archive"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter is the pinned release
        run: |
          read -r version revision < <(flutter --version --machine \
            | python3 -I -c 'import json,sys; d=json.load(sys.stdin); print(d["frameworkVersion"], d["frameworkRevision"])')
          if [ "$version" != "$FLUTTER_VERSION" ] || [ "$revision" != "$FLUTTER_REVISION" ]; then
            echo "::error::Expected Flutter $FLUTTER_VERSION at $FLUTTER_REVISION, got $version at $revision" >&2
            exit 1
          fi
          echo "Flutter $version at $revision"

      - name: Mobile gate
        # The mobile stage of the local gate, unchanged, so CI and a laptop cannot disagree about
        # what it checks: dependencies from the lockfile only, dart format, design tokens and
        # strings current, flutter analyze, the architecture and platform guards, the tests with
        # coverage, lib/core line coverage >= 80%, and the Android debug APK. The stage also runs
        # the repository hygiene, user guide and docs checks that every verify.sh stage runs.
        run: tools/verify.sh mobile

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 so PIT's SCM goal can diff against the base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Backend mutation
        # PIT 1.20 removed the scmMutationCoverage goal, so the scoped-to-changed-classes run
        # ADR-0024 describes is no longer available out of the box. Running the full analysis
        # everywhere instead: the codebase is small enough that it costs seconds, and a scoped
        # run that does not exist is worse than a full one that does. Revisit when this gets
        # slow — that is the point at which the ADR's reasoning starts to bite.
        #
        # test-compile is NOT optional. PIT mutates target/classes and runs target/test-classes;
        # on a clean checkout both are empty, and PIT's response is "No mutations found", which
        # reads like a filter problem rather than a missing build. It passed locally only
        # because a previous `mvn verify` had left the output behind.
        run: mvn -B -f backend test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-reports
          path: backend/target/pit-reports/
          retention-days: 14
          if-no-files-found: ignore

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks
        # Pinned to a commit, not the moving `v2` tag: a tag can be repointed at any commit,
        # so `@v2` means "whatever gitleaks publishes next" — arbitrary third-party code
        # running in CI with a token. Resolved from refs/tags/v2^{} (2025-04-16).
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      # `contents: read` is required as well: a job-level block replaces the workflow-level
      # one entirely, so omitting it left checkout relying on default-token behaviour.
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # `actions` analyses the workflow files themselves. java-kotlin arrived with backend/.
        language: [javascript-typescript, java-kotlin, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: matrix.language == 'java-kotlin'
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
      - uses: github/codeql-action/init@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3.39.5
        with:
          # NOT `language:` — that input does not exist, and CodeQL only emits a warning for
          # an unknown input, so the misspelling silently disabled the matrix.
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/autobuild@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3.39.5
      - uses: github/codeql-action/analyze@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3.39.5
