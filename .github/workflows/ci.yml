name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full mutation run. Scoped-to-changed-classes runs on every PR; this catches decay
    # in code nobody has touched (ADR-0024).
    - cron: '0 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. Job-level blocks REPLACE this one rather than merging with it,
# so every job that needs anything states its full set explicitly.
permissions:
  contents: read

jobs:
  gate:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          # No `cache: maven` here: it fails the job outright when no pom.xml exists, which
          # is the state until the backend lands. Cached explicitly below instead.

      - name: Cache Maven packages
        if: hashFiles('backend/pom.xml') != ''
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Flutter
        if: hashFiles('mobile/pubspec.yaml') != ''
        # Pinned to a commit, not the moving v2 tag (see the gitleaks note below for why).
        # Resolved from refs/tags/v2.9.1^{}.
        uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          channel: stable

      - name: Require Docker for integration tests
        # Testcontainers runs the real PostgreSQL the integration tests and Flyway migrations
        # need (ADR-0009). Asserted explicitly so a runner without Docker fails HERE, with a
        # message that says why, rather than silently skipping the tests that matter most.
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo "::error::Docker is unavailable on this runner. Integration tests use" \
                 "Testcontainers against real PostgreSQL (ADR-0009) and cannot be skipped in CI." >&2
            exit 1
          fi
          docker --version

      - name: Run the gate
        # CI=true is set by GitHub Actions and makes tools/verify.sh strict: anything that
        # SHOULD have run but could not (Docker, missing toolchain, uninstalled deps) becomes a
        # failure rather than a skip. Unit tests, integration tests and coverage thresholds all
        # run inside this one gate, so a failure in any of them fails the PR.
        env:
          CI: 'true'
        run: tools/verify.sh

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/site/jacoco/
            frontend/coverage/
            mobile/coverage/
          retention-days: 7
          if-no-files-found: ignore

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 so PIT's SCM goal can diff against the base branch.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # NOTE: these guards are step-level, not job-level, on purpose. hashFiles() at job level
      # is evaluated before checkout, when the workspace is empty, so it always returns '' and
      # the job would silently never run.
      - name: Backend mutation — changed classes (PR) or full (schedule)
        if: hashFiles('backend/pom.xml') != ''
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Full mutation run"
            mvn -B -f backend org.pitest:pitest-maven:mutationCoverage
          else
            echo "Mutation run scoped to classes changed against ${{ github.base_ref || 'main' }}"
            mvn -B -f backend org.pitest:pitest-maven:scmMutationCoverage \
              -Dpit.scm.originBranch=origin/${{ github.base_ref || 'main' }}
          fi

      - name: Frontend mutation
        if: hashFiles('frontend/package.json') != ''
        run: |
          npm --prefix frontend ci --no-audit --no-fund
          npm --prefix frontend run test:mutation

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-reports
          path: |
            backend/target/pit-reports/
            frontend/reports/mutation/
          retention-days: 14
          if-no-files-found: ignore

  ui:
    name: UI validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install UI harness
        working-directory: tools/ui
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Prove the UI harness works
        run: tools/ui-check.sh --selfcheck
      - name: Prove the user-guide capture pipeline works
        run: tools/userguide-capture.sh --selfcheck
      - name: Check the user guide for rot
        run: tools/userguide-check.sh
      - name: Prove captures refuse a non-local target
        run: |
          if tools/userguide-capture.sh --url https://budget.example.com >/dev/null 2>&1; then
            echo "Capture guard did NOT refuse a remote target — see ADR-0013" >&2
            exit 1
          fi
          echo "Capture guard correctly refused a remote target."
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-artifacts
          path: tools/ui/artifacts/
          retention-days: 7

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        # Pinned to a commit, not the moving `v2` tag: a tag can be repointed at any commit,
        # so `@v2` means "whatever gitleaks publishes next" — arbitrary third-party code
        # running in CI with a token. Resolved from refs/tags/v2^{} (2025-04-16).
        # Bump deliberately, re-resolving with:
        #   git ls-remote --tags https://github.com/gitleaks/gitleaks-action.git 'v2*'
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          # Read-only by the job permissions above: this is the narrowest token the action
          # can be given while still reading the commit range it scans.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      # `contents: read` is required as well: a job-level block replaces the workflow-level
      # one entirely, so omitting it left checkout relying on default-token behaviour.
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # `actions` analyses the workflow files themselves. It was running anyway — the input
        # below was misspelled `language`, so the matrix was ignored and CodeQL auto-detected
        # every language it found. Listing it explicitly makes workflow scanning intentional
        # and keeps it on; removing it to quieten a finding would be suppressing the check.
        #
        # java-kotlin is added when backend/ exists — autobuild fails outright on a repository
        # with no Java source, and a permanently red check trains people to ignore CI.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          # NOT `language:` — that input does not exist, and CodeQL only emits a warning for
          # an unknown input, so the misspelling silently disabled the matrix.
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
