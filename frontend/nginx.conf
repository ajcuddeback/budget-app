server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the version to anyone scanning.
    server_tokens off;

    # This app talks to its own instance and nothing else. The CSP says so, which turns a future
    # injected <script src="evil.com"> into a blocked request rather than an exfiltration.
    # 'unsafe-inline' for styles only: Angular injects component styles at runtime.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Hashed filenames: safe to cache hard.
    location ~* \.(js|css|woff2|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html is never cached, or an upgrade leaves people on the old app.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA routing: unknown paths are Angular routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
