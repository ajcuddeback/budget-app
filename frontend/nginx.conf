server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the version to anyone scanning.
    server_tokens off;

    # This app talks to its own instance and nothing else. The CSP says so, which turns a future
    # injected <script src="evil.com"> into a blocked request rather than an exfiltration.
    # 'unsafe-inline' for styles only: Angular injects component styles at runtime.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Hashed filenames: safe to cache hard.
    location ~* \.(js|css|woff2|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html is never cached, or an upgrade leaves people on the old app.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The API lives in the same origin as the app, deliberately.
    #
    # Same-origin means the session cookie needs no SameSite=None, there is no CORS preflight on
    # every request, and the CSP's connect-src stays 'self'. A self-hoster behind one reverse
    # proxy on one hostname is the normal deployment; splitting the origins would make all three
    # of those someone else's problem to configure correctly.
    location /api/ {
        # Resolve `api` per request, not once at startup.
        #
        # nginx resolves an upstream hostname written literally in proxy_pass when it loads its
        # config, and then caches it forever. Two consequences on a self-hosted box, both bad:
        # `docker compose up` leaves this container DEAD if the API is still starting, and an API
        # that restarts comes back on a new IP that nginx never notices. Going through a variable
        # forces runtime resolution, which is why the resolver line is required rather than
        # decorative. 127.0.0.11 is Docker's embedded DNS.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;

        # The API builds no absolute URLs, but it does need the real client address: rate
        # limiting is per IP, and so is the authentication audit trail. Without these every
        # request appears to come from this container.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A slow upstream should fail, not hang a browser tab open indefinitely.
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # File import (docs/features/file-import.md rule 3, layer a). The only route that takes a body
    # bigger than nginx's 1 MiB default: a statement of up to 5 MiB, sent as base64 inside JSON,
    # is just under 7 MiB on the wire. Every other route keeps the default, which is the point of
    # scoping it here rather than raising it for /api/ as a whole.
    #
    # Two settings stop nginx writing a statement to disk, which ADR-0038 forbids as firmly for
    # this container as for the API's:
    #   proxy_request_buffering off  streams the request body to the API as it arrives, instead of
    #                                spooling anything over client_body_buffer_size (16 KiB) to
    #                                /var/cache/nginx/client_temp;
    #   proxy_max_temp_file_size 0   never buffers the preview RESPONSE to proxy_temp either — it
    #                                is the statement read back, row by row.
    #
    # Over the cap, the answer is the API's own problem body, so a client handles one meaning of
    # 413 whichever layer refused. tools/nginx-check.sh sends a body just under and just over the
    # cap through this exact file; a limit nobody has watched fail is not a limit.
    location /api/imports {
        client_max_body_size 7m;
        client_body_buffer_size 64k;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        error_page 413 = @import_too_large;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # The API's parse deadline is 15 s, a commit of ten thousand rows takes a few more.
        proxy_read_timeout    60s;
    }

    location @import_too_large {
        # No add_header here: one would stop the server's CSP and nosniff headers being inherited.
        default_type application/problem+json;
        return 413 '{"type":"https://budgetowl.app/errors/import-file-too-large","title":"The file is too large","status":413,"detail":"The file is too large.","code":"import-file-too-large"}';
    }

    # SPA routing: unknown paths are Angular routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
