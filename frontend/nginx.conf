server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the version to anyone scanning.
    server_tokens off;

    # This app talks to its own instance and nothing else. The CSP says so, which turns a future
    # injected <script src="evil.com"> into a blocked request rather than an exfiltration.
    # 'unsafe-inline' for styles only: Angular injects component styles at runtime.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Hashed filenames: safe to cache hard.
    location ~* \.(js|css|woff2|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html is never cached, or an upgrade leaves people on the old app.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The API lives in the same origin as the app, deliberately.
    #
    # Same-origin means the session cookie needs no SameSite=None, there is no CORS preflight on
    # every request, and the CSP's connect-src stays 'self'. A self-hoster behind one reverse
    # proxy on one hostname is the normal deployment; splitting the origins would make all three
    # of those someone else's problem to configure correctly.
    location /api/ {
        # Resolve `api` per request, not once at startup.
        #
        # nginx resolves an upstream hostname written literally in proxy_pass when it loads its
        # config, and then caches it forever. Two consequences on a self-hosted box, both bad:
        # `docker compose up` leaves this container DEAD if the API is still starting, and an API
        # that restarts comes back on a new IP that nginx never notices. Going through a variable
        # forces runtime resolution, which is why the resolver line is required rather than
        # decorative. 127.0.0.11 is Docker's embedded DNS.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;

        # The API builds no absolute URLs, but it does need the real client address: rate
        # limiting is per IP, and so is the authentication audit trail. Without these every
        # request appears to come from this container.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A slow upstream should fail, not hang a browser tab open indefinitely.
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # SPA routing: unknown paths are Angular routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
