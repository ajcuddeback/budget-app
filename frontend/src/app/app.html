<a class="skip-link" href="#main" (click)="$event.preventDefault(); skipToMain()">
  {{ 'app.skipToContent' | t }}
</a>

<header class="masthead page">
  <a class="brand" routerLink="/">{{ 'app.name' | t }}</a>

  @if (signedIn()) {
    <nav class="nav" [attr.aria-label]="'nav.label' | t">
      <a routerLink="/household" routerLinkActive="active" ariaCurrentWhenActive="page">{{
        'nav.household' | t
      }}</a>
      <a routerLink="/devices" routerLinkActive="active" ariaCurrentWhenActive="page">{{
        'nav.devices' | t
      }}</a>
      <a routerLink="/preferences" routerLinkActive="active" ariaCurrentWhenActive="page">{{
        'nav.preferences' | t
      }}</a>
    </nav>
  }

  <div class="masthead-actions">
    <button type="button" class="btn btn-secondary btn-small" (click)="toggleTheme()">
      {{ themeLabel() | t }}
    </button>
    @if (signedIn()) {
      <button type="button" class="btn btn-secondary btn-small" (click)="signOut()">
        {{ 'nav.signOut' | t }}
      </button>
    }
  </div>
</header>

<main id="main" class="page main" tabindex="-1">
  <router-outlet />
</main>
