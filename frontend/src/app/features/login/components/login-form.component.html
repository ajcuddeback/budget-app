<form class="stack" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="field">
    <label for="login-email">{{ 'login.email' | t }}</label>
    <input
      id="login-email"
      class="input"
      type="email"
      formControlName="email"
      autocomplete="username"
      spellcheck="false"
      aria-describedby="login-email-error"
      [attr.aria-invalid]="form.controls.email.invalid && form.controls.email.touched ? 'true' : null"
    />
    <app-field-error [control]="form.controls.email" errorId="login-email-error" />
  </div>

  <div class="field">
    <label for="login-password">{{ 'login.password' | t }}</label>
    <input
      id="login-password"
      class="input"
      type="password"
      formControlName="password"
      autocomplete="current-password"
      aria-describedby="login-password-error"
      [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched ? 'true' : null"
    />
    <app-field-error [control]="form.controls.password" errorId="login-password-error" />
  </div>

  <div>
    <button type="submit" class="btn btn-primary" [disabled]="busy()">
      {{ (busy() ? 'login.signingIn' : 'login.signIn') | t }}
    </button>
  </div>
</form>
