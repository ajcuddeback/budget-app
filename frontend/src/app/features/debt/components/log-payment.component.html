<dialog appModal class="dialog" aria-labelledby="log-payment-title" (dismissed)="closed.emit()">
  <form [formGroup]="form" (ngSubmit)="submit()" class="stack">
    <h2 class="card-title" id="log-payment-title">
      {{ 'debt.payment.title' | t: { name: debt().name } }}
    </h2>

    <app-error-alert [error]="error()" />

    <p class="card-note">{{ 'debt.payment.lede' | t }}</p>

    <div class="field">
      <label for="payment-amount">{{ 'debt.payment.amount' | t }}</label>
      <!-- type="text" with inputmode="decimal", never type="number" (ADR-0006). -->
      <input
        id="payment-amount"
        class="input"
        type="text"
        inputmode="decimal"
        autocomplete="off"
        formControlName="amount"
        aria-describedby="payment-amount-hint payment-amount-error"
        [attr.aria-invalid]="
          form.controls.amount.invalid && form.controls.amount.touched ? 'true' : null
        "
      />
      <p class="field-hint" id="payment-amount-hint">{{ 'debt.payment.amountHint' | t }}</p>
      <app-field-error [control]="form.controls.amount" errorId="payment-amount-error" />

      <!-- The two one-tap alternatives the designs offer. Each fills the field; neither submits,
           because the figure that reaches the server is one the household asserted. -->
      <div class="cluster quick">
        <button type="button" class="btn btn-secondary btn-small" (click)="use(scheduled())">
          {{ 'debt.payment.useScheduled' | t: { amount: scheduled() | money: debt().currency } }}
        </button>
        @if (withExtra(); as more) {
          <button type="button" class="btn btn-secondary btn-small" (click)="use(more)">
            {{ 'debt.payment.useMore' | t: { amount: more | money: debt().currency } }}
          </button>
        }
      </div>
    </div>

    <div class="field">
      <label for="payment-date">{{ 'debt.payment.paidDate' | t }}</label>
      <input
        id="payment-date"
        class="input"
        type="date"
        formControlName="paidDate"
        aria-describedby="payment-date-error"
        [attr.aria-invalid]="
          form.controls.paidDate.invalid && form.controls.paidDate.touched ? 'true' : null
        "
      />
      <app-field-error [control]="form.controls.paidDate" errorId="payment-date-error" />
    </div>

    <div class="field">
      <label for="payment-account">{{ 'debt.payment.paidFrom' | t }}</label>
      <select id="payment-account" class="input" formControlName="paidFromAccountId">
        <option value="">{{ 'debt.payment.noAccount' | t }}</option>
        @for (account of openAccounts(); track account.id) {
          <option [value]="account.id">{{ account.name }}</option>
        }
      </select>
      <!-- Not a transaction, and not where the debt is held: it is where the money left, which is
           where a matching charge will be looked for later. Nothing is written to it. -->
      <p class="field-hint">{{ 'debt.payment.paidFromHint' | t }}</p>
    </div>

    <div class="field">
      <label for="payment-note">{{ 'debt.payment.note' | t }}</label>
      <input
        id="payment-note"
        class="input"
        type="text"
        maxlength="500"
        autocomplete="off"
        formControlName="note"
      />
    </div>

    <!-- The split is the server's to work out, under the rate in force on the day. Saying so is
         honest; working it out here would be a second implementation of the one formula this
         whole feature turns on. -->
    <p class="card-note">{{ 'debt.payment.splitNote' | t }}</p>

    <div class="cluster dialog-actions">
      <button type="submit" class="btn btn-primary" [disabled]="busy()">
        {{ (busy() ? 'common.saving' : 'debt.payment.record') | t }}
      </button>
      <button type="button" class="btn btn-secondary" [disabled]="busy()" (click)="closed.emit()">
        {{ 'common.cancel' | t }}
      </button>
    </div>
  </form>
</dialog>
