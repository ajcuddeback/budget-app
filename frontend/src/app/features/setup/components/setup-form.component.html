<form class="stack" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="field">
    <label for="setup-name">{{ 'setup.name' | t }}</label>
    <input
      id="setup-name"
      class="input"
      type="text"
      formControlName="displayName"
      autocomplete="name"
      aria-describedby="setup-name-error"
      [attr.aria-invalid]="form.controls.displayName.invalid && form.controls.displayName.touched ? 'true' : null"
    />
    <app-field-error [control]="form.controls.displayName" errorId="setup-name-error" />
  </div>

  <div class="field">
    <label for="setup-email">{{ 'setup.email' | t }}</label>
    <input
      id="setup-email"
      class="input"
      type="email"
      formControlName="email"
      autocomplete="email"
      spellcheck="false"
      aria-describedby="setup-email-error"
      [attr.aria-invalid]="form.controls.email.invalid && form.controls.email.touched ? 'true' : null"
    />
    <app-field-error [control]="form.controls.email" errorId="setup-email-error" />
  </div>

  <div class="field">
    <label for="setup-password">{{ 'setup.password' | t }}</label>
    <input
      id="setup-password"
      class="input"
      type="password"
      formControlName="password"
      autocomplete="new-password"
      aria-describedby="setup-password-hint setup-password-error"
      [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched ? 'true' : null"
    />
    <p class="field-hint" id="setup-password-hint">
      {{ 'setup.passwordHint' | t: { min: minimumLength } }}
    </p>
    <app-field-error [control]="form.controls.password" errorId="setup-password-error" />
  </div>

  <div class="field">
    <label for="setup-household">{{ 'setup.householdName' | t }}</label>
    <input
      id="setup-household"
      class="input"
      type="text"
      formControlName="householdName"
      autocomplete="off"
      aria-describedby="setup-household-error"
      [attr.aria-invalid]="form.controls.householdName.invalid && form.controls.householdName.touched ? 'true' : null"
    />
    <app-field-error [control]="form.controls.householdName" errorId="setup-household-error" />
  </div>

  <app-currency-field
    fieldId="setup-currency"
    [control]="form.controls.baseCurrency"
    [label]="'setup.baseCurrency' | t"
    [hint]="'setup.baseCurrencyHint' | t"
  />

  <div>
    <button type="submit" class="btn btn-primary" [disabled]="busy()">
      {{ (busy() ? 'setup.creating' : 'setup.create') | t }}
    </button>
  </div>
</form>
