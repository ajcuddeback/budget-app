<dialog appModal class="dialog" aria-labelledby="quick-add-title" (closed)="closed.emit()">
  <form [formGroup]="form" (ngSubmit)="submit()" class="stack">
    <h2 class="card-title" id="quick-add-title">
      {{ titleKey() | t: { envelope: envelope().name } }}
    </h2>

    <app-error-alert [error]="error()" />

    <div class="field">
      <label for="entry-amount">{{ 'envelopes.amount' | t }}</label>
      <!-- First, focused, and inputmode="decimal" so a phone opens the keypad. Deliberately
           type="text": a number input hands back a double (ADR-0006). -->
      <input
        id="entry-amount"
        class="input"
        type="text"
        inputmode="decimal"
        autocomplete="off"
        formControlName="amount"
        aria-describedby="entry-amount-hint entry-amount-error"
        [attr.aria-invalid]="
          form.controls.amount.invalid && form.controls.amount.touched ? 'true' : null
        "
      />
      <p class="field-hint" id="entry-amount-hint">
        {{ 'envelopes.amountHint' | t: { currency: envelope().currency } }}
      </p>
      <app-field-error [control]="form.controls.amount" errorId="entry-amount-error" />
    </div>

    <!-- Everything below is optional. Nothing here may stand between somebody and a logged
         amount; the feature doc is explicit that this is the 81-times-a-month action. -->
    <div class="field">
      <label for="entry-payee">{{ 'envelopes.payee' | t }}</label>
      <input
        id="entry-payee"
        class="input"
        type="text"
        maxlength="80"
        autocomplete="off"
        formControlName="payeeName"
        aria-describedby="entry-payee-hint"
      />
      <p class="field-hint" id="entry-payee-hint">{{ 'envelopes.optional' | t }}</p>
    </div>

    <div class="field">
      <label for="entry-date">{{ 'envelopes.date' | t }}</label>
      <input id="entry-date" class="input" type="date" formControlName="date" />
    </div>

    <div class="field">
      <label for="entry-note">{{ 'envelopes.note' | t }}</label>
      <input
        id="entry-note"
        class="input"
        type="text"
        maxlength="500"
        autocomplete="off"
        formControlName="note"
        aria-describedby="entry-note-error"
      />
      <app-field-error [control]="form.controls.note" errorId="entry-note-error" />
    </div>

    <div class="cluster dialog-actions">
      <button type="submit" class="btn btn-primary" [disabled]="busy()">
        {{ (busy() ? 'common.saving' : 'envelopes.logIt') | t }}
      </button>
      <button type="button" class="btn btn-secondary" [disabled]="busy()" (click)="closed.emit()">
        {{ 'common.cancel' | t }}
      </button>
    </div>
  </form>
</dialog>
