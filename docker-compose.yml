# Budget Owl — the deployable unit (ADR-0016).
#
# This file IS the product for a self-hoster. It must work on a home server with nothing
# configured beyond a database password, and it must never require a service we operate.
#
#   cp .env.example .env    # then set DB_PASSWORD
#   docker compose up -d
#
# The app is then on http://localhost:8080. Put TLS in front of it before exposing it to the
# internet — see userguide/installing.md.

name: budget-owl

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-budgetowl}
      POSTGRES_USER: ${DB_USER:-budgetowl}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set — see .env.example}
    volumes:
      - db-data:/var/lib/postgresql/data
    # NOT published to the host. The API reaches it on the internal network; nothing else should.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-budgetowl} -d ${DB_NAME:-budgetowl}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    image: ghcr.io/ajcuddeback/budget-owl-api:${BUDGET_OWL_VERSION:-latest}
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-budgetowl}
      DB_USER: ${DB_USER:-budgetowl}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set — see .env.example}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  web:
    image: ghcr.io/ajcuddeback/budget-owl-web:${BUDGET_OWL_VERSION:-latest}
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    # The only port that reaches the host. Bound to loopback by default: an instance is not
    # exposed to your LAN, let alone the internet, until you decide it should be.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"

volumes:
  db-data:
